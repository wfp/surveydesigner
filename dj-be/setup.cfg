[tool:pytest]
DJANGO_SETTINGS_MODULE = survey_designer.settings
testpaths = survey_designer
python_files = test*.py
junit_family = legacy
addopts =
    -vvv
    -n auto
    --cov survey_designer
    --cov-fail-under 70
    --cov-report xml
    --cov-report html
    --cov-report term-missing:skip-covered
    --junitxml test-results.xml
    --durations 5

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    raise NotImplemented

[coverage:run]
source = survey_designer
branch = True
omit =
    */?sgi.py

[isort]
multi_line_output = 3
include_trailing_comma = True
line_length = 88
force_grid_wrap = 0
combine_as_imports = True

[flake8]
max-line-length = 88
ignore = E203, E266, E501, W503, C901
max-complexity = 10
select = B,C,E,F,W,T4,B9
exclude = .tox, migrations
inline-quotes = "
