name: 📖 User Story
description: Define a specific technical or user-facing requirement
title: "user-story: <title>"
labels: ["user-story"]
body:
  - type: input
    id: parent-issue
    attributes:
      label: 🚀 Parent Feature
      description: Enter the link or issue number of the Parent Feature (#123).
      placeholder: "#123"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Use this template to detail a specific user story.
        
        > [!IMPORTANT]
        > **Hierarchy Rules:**
        > - **User Stories** MUST have a **Parent Feature**.
        > - **User Stories** contain **ONLY Tasks** as children.
        > - **User Stories** **cannot** have another User Story or Epic as parent/child.

  - type: textarea
    id: user-story
    attributes:
      label: 📖 User Story
      description: |
        As a [user/admin/developer]
        I need to [perform this action]
        So that [I receive this value/benefit]
    validations:
      required: true

  - type: checkboxes
    id: software-layer
    attributes:
      label: 💻 Software layer
      multiple: true
      description: What part is affected?
      options:
        - Front-end
        - Back-end

  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: 📋 Acceptance Criteria
      description: List the conditions that must be met for this story to be considered complete.
      options:
        - label: "Condition 1"
        - label: "Condition 2"
        - label: "Edge Case"

  - type: textarea
    id: included-tasks
    attributes:
      label: 🛠️ Included Tasks
      description: List the technical tasks that belong to this User Story.
      placeholder: |
        - [ ] #101
    validations:
      required: false

  - type: input
    id: mockups
    attributes:
      label: 🎨 UI/UX Mockups (Optional)
      description: Use Penpot
      placeholder: "Attached Penpot in the issue"

  - type: textarea
    id: technical-notes
    attributes:
      label: ⚙️ Technical Implementation Notes
      description: Describe proposed implementation details or technical constraints.

  - type: textarea
    id: impact
    attributes:
      label: 🛑 Impact / Breaking Changes
      description: Does this affect existing features or require migrations?

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
