name: Issue Hierarchy Validator

on:
  issues:
    types: [opened, edited]

jobs:
  validate-hierarchy:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Validate Parent/Child Relationship
        uses: actions/github-script@v7
        with:
          script: |
            // Native issue types are the source of truth for hierarchy.
            const rules = {
              'Epic': { parentType: null },
              'Feature': { parentType: 'Epic' },
              'User Story': { parentType: 'Feature' },
              'Task': { parentType: 'User Story' }
            };

            // REST responses and webhook payloads can expose the native type in
            // either `type` or `issue_type`, and some versions expose its name
            // directly while others expose a { name } object.
            const getNativeType = (issue) => {
              const type = issue?.type ?? issue?.issue_type;
              if (typeof type === 'string') return type;
              return type?.name || null;
            };

            // Fetch the current issue so hierarchy decisions do not depend on
            // the webhook payload shape. Fall back to the payload if needed.
            const payloadIssue = context.payload.issue || {};
            let issue = payloadIssue;
            try {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              issue = data;
            } catch (error) {
              core.warning(`Could not refresh issue #${context.issue.number}; using the event payload.`);
            }

            const currentType = getNativeType(issue) || getNativeType(payloadIssue);
            const body = issue.body || "";

            if (!rules[currentType]) return; // Not a hierarchy-tracked issue (e.g. Bug)

            // If it's an Epic, ensure it has NO parent of type Epic.
            if (currentType === 'Epic') {
              const match = body.match(/### Parent Epic\s*\n\n?#(\d+)/i);
              if (match) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "⚠️ **Hierarchy Violation**: An **Epic** cannot have a parent Epic. It should be a top-level item."
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['invalid-hierarchy']
                });
              }
              return;
            }

            const rule = rules[currentType];
            
            // Extract parent number
            // Matches "### Parent ... \n\n #123" or similar from YAML form rendering
            const parentMatch = body.match(/### Parent .*\s*\n\n?#(\d+)/i);
            
            if (!parentMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ **Hierarchy Violation**: This **${currentType}** is missing a valid Parent reference (e.g. #123). Please ensure you link the correct parent issue.`
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['invalid-hierarchy']
              });
              return;
            }

            const parentNumber = parseInt(parentMatch[1]);

            try {
              const { data: parentIssue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber
              });

              const parentType = getNativeType(parentIssue);

              if (parentType !== rule.parentType) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `⚠️ **Hierarchy Violation**: A **${currentType}** must have a parent of type **${rule.parentType}**. \n\nParent issue #${parentNumber} has native type **${parentType || 'none'}**, not the required type.`
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['invalid-hierarchy']
                });
              } else {
                // Success: remove invalid label if it exists
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'invalid-hierarchy'
                  });
                } catch (e) {
                  // Ignore if label not present
                }
              }
            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ **Hierarchy Error**: Could not find parent issue #${parentNumber}. Please check the issue number.`
              });
            }
